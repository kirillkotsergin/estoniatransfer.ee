# Сборка Astro и выкладка на zone.ee.
#
# ВАЖНО про триггер. Деплой идёт по push в main — включено 17.08, после того
# как первый выкат прошёл и на домене вместо WordPress встал этот сайт. До
# этого запуск был только ручной, потому что rsync --delete делает хостинг
# точной копией dist/ и один прогон с недособранным сайтом снёс бы рабочий.
# Страховки на месте: проверка готовности dist/ до копирования и smoke-check
# после. Ручной запуск тоже остался.
#
# Фильтр paths значит, что правка README или CLAUDE.md деплой не запускает.
#
# Node нужен только здесь, на сборке. На сервере его нет и не требуется:
# Astro отдаёт готовые HTML-файлы.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build + rsync dist/ -> htdocs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Проверить, что заданы все секреты
        env:
          KEY: ${{ secrets.ZONE_SSH_PRIVATE_KEY }}
          USER: ${{ secrets.ZONE_SSH_USER }}
          HOST: ${{ secrets.ZONE_SSH_HOST }}
          PATH_REMOTE: ${{ secrets.ZONE_REMOTE_PATH }}
        run: |
          missing=""
          [ -z "$KEY" ]         && missing="$missing ZONE_SSH_PRIVATE_KEY"
          [ -z "$USER" ]        && missing="$missing ZONE_SSH_USER"
          [ -z "$HOST" ]        && missing="$missing ZONE_SSH_HOST"
          [ -z "$PATH_REMOTE" ] && missing="$missing ZONE_REMOTE_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Все четыре секрета на месте."

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      # Предохранитель. Без него один запуск по недоразумению удаляет живой
      # сайт и оставляет пустой каталог.
      - name: Проверить, что dist/ действительно содержит сайт
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error::dist/index.html отсутствует или пуст — деплой остановлен."
            echo "rsync --delete сделал бы htdocs копией пустого каталога."
            exit 1
          fi
          files=$(find dist -type f | wc -l)
          echo "Файлов в dist/: $files"
          if [ "$files" -lt 3 ]; then
            echo "::error::В dist/ всего $files файлов — это похоже на сломанную сборку."
            exit 1
          fi
          grep -qi "estoniatransfer" dist/index.html \
            || { echo "::error::В dist/index.html нет упоминания estoniatransfer."; exit 1; }
          test -s dist/en/index.html \
            || { echo "::error::Английская версия не собралась."; exit 1; }

      - name: Подготовить SSH
        env:
          KEY: ${{ secrets.ZONE_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.ZONE_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::Приватный ключ в секрете не читается. Скопирован целиком, вместе со строками BEGIN и END?"
            exit 1
          fi
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan не получил host-key от $HOST. Возможен IP Whitelist на хостинге."
            exit 1
          fi

      - name: Проверить вход и право записи
        env:
          USER: ${{ secrets.ZONE_SSH_USER }}
          HOST: ${{ secrets.ZONE_SSH_HOST }}
          PATH_REMOTE: ${{ secrets.ZONE_REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" "test -d '$PATH_REMOTE' && test -w '$PATH_REMOTE' && command -v rsync >/dev/null" \
            || { echo "::error::Вход не удался, нет каталога, нет права записи или нет rsync."; exit 1; }

      - name: rsync
        env:
          USER: ${{ secrets.ZONE_SSH_USER }}
          HOST: ${{ secrets.ZONE_SSH_HOST }}
          PATH_REMOTE: ${{ secrets.ZONE_REMOTE_PATH }}
        run: |
          rsync -rlvz --delete \
            --exclude='.well-known/' \
            --exclude='.git*' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            dist/ "$USER@$HOST:$PATH_REMOTE/"

      - name: Smoke-check
        env:
          HOST: ${{ secrets.ZONE_SSH_HOST }}
        run: |
          sleep 3
          # Посадочные страницы проверяем тоже: они лежат подкаталогами, и
          # ошибка в сборке или в правилах Apache видна только по ним —
          # главная при этом продолжает отдавать 200.
          for p in "/" "/en/" "/transfer-tallinn-narva/" "/kak-dobratsya-do-granicy/"; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "https://$HOST$p")
            echo "$p → $code"
            [ "$code" = "200" ] || { echo "::error::$p отдал $code вместо 200."; exit 1; }
            grep -qi "transfer" /tmp/page.html || { echo "::error::В ответе $p нет ожидаемого текста."; exit 1; }
          done
          echo "Оба языка отвечают."
